[package]
name = "syntax"
version = "0.2.0"
edition = "2024"

# No grammar crate is a dependency any more (`PLAN.md` Track 24 Phase 3):
# grammars and their highlight queries arrive through `fg-extension`'s
# contribution API, so this crate owns the tree-sitter machinery and knows
# nothing about which languages exist. `tree-sitter-language` is the single
# type a compiled-in grammar is described as, and `libloading` is what opens
# one that was not compiled in.
[dependencies]
fg-core = { path = "../core" }
fg-extension = { path = "../extension" }
tree-sitter = "0.26.11"
tree-sitter-language = "0.1"
libloading = "0.8.9"

# For tests only: the languages this build ships with, so that this crate's
# own Java/Kotlin tests have a grammar to parse with. A real dependency
# would put back the edge this phase removed.
[dev-dependencies]
fg-languages = { path = "../languages" }
