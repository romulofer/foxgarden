[package]
name = "fg-core"
version = "0.2.0"
edition = "2024"

[dependencies]
# The dependency runs this way and only this way: the core consumes the
# extension registry, while `fg-extension` depends on nothing here. That
# direction is what keeps a language-agnostic registry from growing the
# JVM assumptions this crate still carries (Maven, Gradle, JDK releases).
fg-extension = { path = "../extension" }
quick-xml = "0.39.4"
ropey = "1.6.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
fg-languages = { path = "../languages" }
tempfile = "3.27.0"
test-support = { path = "../test-support" }
