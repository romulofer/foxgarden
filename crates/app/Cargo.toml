[package]
name = "foxgarden"
version = "0.1.0"
edition = "2024"
description = "A light, native code editor for Java and Kotlin, built in Rust."
repository = "https://github.com/romulofer/foxgarden"

[dependencies]
arboard = "3.6.1"
eframe = { version = "0.35.0", features = ["persistence"] }
egui = "0.35.0"
fg-core = { path = "../core" }
notify = "8.2.0"
rfd = "0.17.2"
ropey = "1.6.1"
syntax = { path = "../syntax" }

[dev-dependencies]
tempfile = "3.27.0"
test-support = { path = "../test-support" }
