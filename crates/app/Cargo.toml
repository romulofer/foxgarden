[package]
name = "foxgarden"
version = "0.2.0"
edition = "2024"
description = "A light, native code editor for Java and Kotlin, built in Rust."
repository = "https://github.com/romulofer/foxgarden"

[dependencies]
arboard = "3.6.1"
directories = "6.0.0"
eframe = { version = "0.35.0", features = ["persistence"] }
egui = "0.35.0"
fg-core = { path = "../core" }
notify = "8.2.0"
portable-pty = "0.9.0"
rfd = "0.17.2"
ropey = "1.6.1"
serde_json = "1.0.151"
similar = "3.1.1"
syntax = { path = "../syntax" }
ureq = "3.3.0"
vt100 = "0.15.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
test-support = { path = "../test-support" }
